<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Spin the Wheel</title>
<style>
  :root { --size: 360px; }
  body { font-family: system-ui, Arial; margin:0; background:#f7f7fb; color:#222; }
  header { text-align:center; padding:16px 12px; font-weight:700; font-size:22px; }
  .wrap { max-width:900px; margin:0 auto; padding:0 16px 28px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; }
  select, input, button { font-size:16px; padding:10px 12px; border-radius:10px; border:1px solid #ddd; background:#fff; }
  button.primary { background:#111; color:#fff; border:0; }
  button.ghost { background:#fff; border:1px solid #ccc; }
  #customRow { display:none; gap:8px; justify-content:center; }
  #customInput { width:min(680px, 90vw); }
  .grid { display:none; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap:10px; margin-top:12px; }
  .chip { display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid #ddd; border-radius:12px; background:#fff; cursor:pointer; }
  .chip[aria-pressed="true"] { border-color:#111; box-shadow:0 0 0 2px #111 inset; font-weight:600; }
  .dot { width:16px; height:16px; border-radius:50%; border:1px solid rgba(0,0,0,.15); }
  .row-actions { display:none; margin-top:6px; gap:8px; }

  .stage { display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:16px; }
  .pointer { width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-bottom:22px solid #111; }
  .wheel-wrap { position:relative; width:var(--size); height:var(--size); }
  .wheel {
    width:100%; height:100%; border-radius:50%;
    border:10px solid #fff; box-shadow:0 8px 20px rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.1);
    transition: transform 4s cubic-bezier(.15,.85,.25,1);  /* smooth spin */
    transform: rotate(0deg);
    background: conic-gradient(#ddd 0 100%); /* replaced dynamically */
  }
  .result { min-height:28px; font-weight:800; font-size:18px; }
</style>
</head>
<body>
<header>🎡 Spin the Wheel</header>
<div class="wrap">
  <div class="bar">
    <label for="mode">Mode:</label>
    <select id="mode">
      <option value="color">Colors</option>
      <option value="custom">Custom</option>
    </select>

    <button id="spinBtn" class="primary" type="button">Spin</button>
    <button id="shuffleBtn" class="ghost" type="button" title="Randomize start">Shuffle</button>
  </div>

  <!-- Custom input -->
  <div id="customRow" class="bar">
    <input id="customInput" placeholder="Type items separated by commas, spaces, or new lines" />
    <button id="setCustom" class="ghost" type="button">Set</button>
  </div>

  <!-- Color selector -->
  <div class="row-actions bar" id="colorActions">
    <button id="allBtn" class="ghost" type="button">Select All</button>
    <button id="noneBtn" class="ghost" type="button">Clear</button>
  </div>
  <div id="colorGrid" class="grid" aria-label="Color choices"></div>

  <div class="stage">
    <div class="pointer" aria-hidden="true"></div>
    <div class="wheel-wrap">
      <div id="wheel" class="wheel" aria-live="polite"></div>
    </div>
    <div id="result" class="result"></div>
  </div>
</div>

<script>
/* ---------- Config ---------- */
const ALL_COLORS = ["red","orange","yellow","green","blue","purple","pink","cyan","lime","gold","indigo","magenta"];

/* ---------- DOM ---------- */
const modeSel = document.getElementById('mode');
const colorGrid = document.getElementById('colorGrid');
const colorActions = document.getElementById('colorActions');
const allBtn = document.getElementById('allBtn');
const noneBtn = document.getElementById('noneBtn');
const customRow = document.getElementById('customRow');
const customInput = document.getElementById('customInput');
const setCustom = document.getElementById('setCustom');

const wheelEl = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const resultEl = document.getElementById('result');

/* ---------- State ---------- */
let entries = []; // array of {label, color}
let currentRotation = 0;

/* ---------- Helpers ---------- */
function parseList(str){
  if (!str) return [];
  const hasSep = /[,\n;|]/.test(str);
  const parts = hasSep ? str.split(/[,\n;|]+/) : str.trim().split(/\s+/);
  return [...new Set(parts.map(s=>s.trim()).filter(Boolean))].slice(0,50);
}
function hsl(i,n){ return `hsl(${Math.round((360/n)*i)} 70% 55%)`; }

function buildColorGrid(){
  colorGrid.innerHTML = '';
  ALL_COLORS.forEach(c=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.setAttribute('aria-pressed','true');
    chip.dataset.color = c;

    const dot = document.createElement('span');
    dot.className = 'dot'; dot.style.background = c;
    const label = document.createElement('span'); label.textContent = c;

    chip.append(dot,label);
    colorGrid.appendChild(chip);
  });
}
function selectedColors(){
  return [...colorGrid.querySelectorAll('.chip[aria-pressed="true"]')].map(ch=>ch.dataset.color);
}

function rebuildFromColors(){
  const cols = selectedColors();
  entries = cols.map(c=>({label:c, color:c}));
  paintWheel();
}
function rebuildFromCustom(list){
  entries = list.map((label,i)=>({label, color: hsl(i, list.length)}));
  paintWheel();
}

function paintWheel(){
  // If no entries, show neutral
  if (!entries.length){
    wheelEl.style.background = 'conic-gradient(#ddd 0 100%)';
    resultEl.textContent = 'Select some colors or add custom items.';
    return;
  }
  // Build conic-gradient with equal slices
  const step = 100 / entries.length;
  const stops = entries.map((e,i)=>{
    const from = (i*step).toFixed(4);
    const to   = ((i+1)*step).toFixed(4);
    return `${e.color} ${from}% ${to}%`;
  }).join(', ');
  wheelEl.style.background = `conic-gradient(${stops})`;
  resultEl.textContent = '';
}

/* Compute rotation that lands a given index at pointer (top).
   Pointer is at 0deg; conic-gradient starts slice 0 at 0deg by default. */
function rotationForIndex(idx, extraTurns=5){
  const n = entries.length;
  const slice = 360/n;
  const centerOfSlice = (idx * slice) + slice/2; // degrees from 0
  // We want centerOfSlice to end up at 0deg under the pointer, so rotate opposite direction.
  // Using negative for clockwise visual spin; add whole turns.
  return -(extraTurns*360 + centerOfSlice);
}

/* ---------- Events ---------- */
colorGrid.addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const pressed = chip.getAttribute('aria-pressed') === 'true';
  chip.setAttribute('aria-pressed', String(!pressed));
  rebuildFromColors();
});

allBtn.addEventListener('click', ()=>{
  colorGrid.querySelectorAll('.chip').forEach(ch=>ch.setAttribute('aria-pressed','true'));
  rebuildFromColors();
});
noneBtn.addEventListener('click', ()=>{
  colorGrid.querySelectorAll('.chip').forEach(ch=>ch.setAttribute('aria-pressed','false'));
  rebuildFromColors();
});

modeSel.addEventListener('change', ()=>{
  const isColor = modeSel.value === 'color';
  colorGrid.style.display = isColor ? 'grid' : 'none';
  colorActions.style.display = isColor ? 'flex' : 'none';
  customRow.style.display = isColor ? 'none' : 'flex';
  if (isColor) {
    rebuildFromColors();
  } else {
    if (!entries.length) rebuildFromCustom(['Yes','No','Maybe']);
  }
});

setCustom.addEventListener('click', ()=>{
  const list = parseList(customInput.value);
  if (!list.length){ resultEl.textContent = 'Type at least one item.'; return; }
  rebuildFromCustom(list);
});
customInput.addEventListener('keydown', (e)=>{
  if (e.key === 'Enter'){ e.preventDefault(); setCustom.click(); }
});

spinBtn.addEventListener('click', ()=>{
  if (!entries.length){ resultEl.textContent = 'Add some items first 🙂'; return; }
  resultEl.textContent = '';
  // pick random winner index and spin to it
  const idx = Math.floor(Math.random() * entries.length);
  const turns = 4 + Math.floor(Math.random()*3); // 4-6 turns
  const target = rotationForIndex(idx, turns);
  currentRotation = target;
  wheelEl.style.transform = `rotate(${target}deg)`;

  // announce result after animation ends
  wheelEl.addEventListener('transitionend', function handler(){
    wheelEl.removeEventListener('transitionend', handler);
    resultEl.textContent = `🎉 Result: ${entries[idx].label}`;
  }, { once:true });
});

shuffleBtn.addEventListener('click', ()=>{
  const deg = Math.floor(Math.random()*360);
  currentRotation = currentRotation + deg;
  wheelEl.style.transition = 'transform .3s ease';
  wheelEl.style.transform = `rotate(${currentRotation}deg)`;
  setTimeout(()=>{ wheelEl.style.transition = 'transform 4s cubic-bezier(.15,.85,.25,1)'; }, 350);
});

/* ---------- Init ---------- */
buildColorGrid();
colorGrid.style.display = 'grid';
colorActions.style.display = 'flex';
rebuildFromColors();
</script>
</body>
</html>
